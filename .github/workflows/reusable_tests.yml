name: Reusable Tests

on: 
  workflow_call:
    inputs:
      pytest_args:
        description: "Additional pytest arguments"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://automationexercise.com"

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip' # Automatically caches based on pyproject.toml

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
        
      - name: Install Chromium & OS Dependencies
        # Restricting it to 'chromium' keeps CI builds fast
        run: python -m playwright install --with-deps chromium

      - name: Run Tests
        env:
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: python -m pytest $PYTEST_ARGS

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: warn
          retention-days: 7