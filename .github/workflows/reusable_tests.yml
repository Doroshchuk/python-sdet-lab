name: Reusable Tests

on: 
  workflow_call:
    inputs:
      pytest_args:
        description: "Determines which tests to execute"
        required: true
        type: string
        default: ""

      install_browser:
        description: "Controls Chromium installation"
        type: boolean
        default: false
        required: false

      artifact_name:
        description: "Prevents artifact naming conflicts"
        type: string
        required: true

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://automationexercise.com"

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip' # Automatically caches based on pyproject.toml
          cache-dependency-path: pyproject.toml

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
        
      - name: Install Chromium & OS Dependencies
        if: ${{ inputs.install_browser }
        # Restricting it to 'chromium' keeps CI builds fast
        run: python -m playwright install --with-deps chromium

      - name: Run Tests
        env:
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: python -m pytest $PYTEST_ARGS

      - name: Upload Playwright failure artifacts
        if: ${{ failure() && inputs.install_browser }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-playwright
          path: test-results/
          if-no-files-found: warn
          retention-days: 7