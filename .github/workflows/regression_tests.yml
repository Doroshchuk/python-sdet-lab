name: Regression Tests

on: 
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-api-regression-tests:
    uses: ./.github/workflows/reusable_tests.yml
    with:
      pytest_args: "tests/api"
      artifact_name: "api-regression"

  run-ui-regression-tests:
    uses: ./.github/workflows/reusable_tests.yml
    with:
      pytest_args: "tests/ui"
      install_browser: true
      artifact_name: "ui-regression"